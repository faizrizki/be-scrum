name: Keep Supabase Alive

on:
  schedule:
    # 03:00 UTC = 10:00 WIB, tiap hari
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoint keep-alive
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "Secret KEEPALIVE_URL belum diset di repo settings."
            exit 1
          fi

          status=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            "$KEEPALIVE_URL")

          echo "HTTP $status"
          cat response.json

          if [ "$status" != "200" ]; then
            echo "Keep-alive gagal."
            exit 1
          fi
